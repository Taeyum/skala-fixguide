spring:
  datasource:
    # Testcontainers 가 PostgreSQL 16 컨테이너를 자동으로 띄운다 (Docker 필요).
    # TC_DAEMON=true 로 같은 JVM 의 모든 테스트 컨텍스트가 컨테이너 하나를 공유한다.
    url: jdbc:tc:postgresql:16-alpine:///fixguide_test?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: fixguide-test-secret-key-that-is-long-enough-for-hs256
    expires-in-seconds: 3600
    issuer: fixguide-test
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: false
  # 테스트 업로드는 build 아래에 쓴다 (clean 으로 정리)
  upload-dir: build/test-uploads
  auth:
    token-blacklist:
      # 테스트는 Redis 없이 돈다. 환경변수가 끼어들지 않도록 값을 고정한다.
      type: memory

logging:
  level:
    com.skala.fixguide: INFO
