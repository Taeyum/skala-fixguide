spring:
  application:
    name: argos

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fixguide}
    username: ${DB_USER:fixguide}
    password: ${DB_PASSWORD:fixguide}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update   # 개발용. 운영 전환 시 validate 로 변경
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:fixguide-dev-jwt-secret-key-change-me-in-production}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}     # ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # ms
