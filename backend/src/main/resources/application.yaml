spring:
  application:
    name: argos

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fixguide}
    username: ${DB_USER:fixguide}
    password: ${DB_PASSWORD:fixguide}

  jpa:
    hibernate:
      ddl-auto: update   # 개발용. 운영 전환 시 validate 로 변경
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB      # 명세 5.9 파일당 10MB
      max-request-size: 60MB

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api/v1      # 명세 1장 Base URL

app:
  upload-dir: ${UPLOAD_DIR:uploads}   # 제품 사진 저장 위치 (로컬)
