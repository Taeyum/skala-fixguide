spring:
  application:
    name: fixguide-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    # 운영에서는 반드시 환경변수로 주입할 것 (.env 는 커밋 금지)
    secret: ${JWT_SECRET:fixguide-local-development-secret-key-please-change}
    expires-in-seconds: ${JWT_EXPIRES_IN:3600}
    issuer: fixguide
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
  auth:
    token-blacklist:
      # redis | memory — 로그아웃된 토큰의 jti 를 어디에 보관할지.
      # Redis 컨테이너가 준비되기 전에도 로컬 실행·테스트가 깨지지 않도록 기본값은 memory 다.
      # 인프라가 올라오면 TOKEN_BLACKLIST_TYPE=redis 로 전환한다.
      type: ${TOKEN_BLACKLIST_TYPE:memory}

logging:
  level:
    com.skala.fixguide: DEBUG
