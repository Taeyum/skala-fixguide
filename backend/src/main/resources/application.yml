spring:
  application:
    name: fixguide-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    # 운영에서는 반드시 환경변수로 주입할 것 (.env 는 커밋 금지)
    secret: ${JWT_SECRET:fixguide-local-development-secret-key-please-change}
    expires-in-seconds: ${JWT_EXPIRES_IN:3600}
    issuer: fixguide
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    com.skala.fixguide: DEBUG
