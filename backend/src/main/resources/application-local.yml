# 로컬 단독 실행용 (기본 프로파일) — docker compose up -d db redis 로 띄운 PostgreSQL 에 붙는다.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fixguide}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:fixguide}
    password: ${DB_PASSWORD:fixguide}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
