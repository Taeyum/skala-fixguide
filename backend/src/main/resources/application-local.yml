# 로컬 단독 실행용 — 도커 없이 ./gradlew bootRun 만으로 뜬다.
spring:
  datasource:
    url: jdbc:h2:mem:fixguide;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
