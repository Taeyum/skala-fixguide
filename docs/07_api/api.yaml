    get:
      tags: [Agent]
      operationId: pollAgentRun
      summary: 에이전트 진행 상태 폴링
      description: |
        상세 조회와 동일한 읽기 권한. 2.5초 간격(`pollIntervalMs`)으로 호출하고 `allDone: true` 가 되면 폴링을 중단,
        **[결과 확인]** 버튼을 활성화한다 (AC 4-3).

        **Mock 전이 (PoC)** — run 이 `RUNNING` 인 동안 호출할 때마다:
        1. 미완료 step 하나를 `DONE` 으로 바꾸고 `agent_results` 에 결과를 생성 (`original_json` = 원본 보존)
        2. 다음 `WAITING` step 을 `RUNNING` 으로 표시
        3. 3개 모두 DONE 이면 `agent_runs.status = DONE`, `finished_at` 기록, `work_requests.status = AI_DONE`

        실제 LLM 결합 시 오케스트레이터가 백그라운드에서 3개를 병렬 실행하고 폴링은 DB 상태만 읽는다. 폴링 계약은 불변.

        ⚠️ step 실패 시 `status: FAILED` 를 반환하되 HTTP 는 200 을 유지하도록 설계되어 있으나,
        현재 DTO 에 `errorMessage` 필드는 없고 Mock 은 FAILED 를 만들지 않는다 (설계문서 16.1 #3 · Phase 2).

