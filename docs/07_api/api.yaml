        content:
          - workRequestId: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
            requestNo: WR-20260903-001
            equipment: 펌프 P-114
            partName: SS-8-VCR
            productType: VALVE
            productTypeLabel: 밸브
            status: PENDING
            statusLabel: 승인 대기
            requesterName: 이엔지
            createdAt: '2026-09-03T10:05:00+09:00'
            submittedAt: '2026-09-03T10:22:00+09:00'
            nextAction: { label: 상세, path: /manage/requests/9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        page: { number: 0, size: 20, totalElements: 5, totalPages: 1 }
    WorkRequestDetailResponse:
      type: object
      description: 상세 (`WorkRequestDetailResponse.java`). null 필드는 생략된다
      required: [workRequestId, requestNo, status, statusLabel, requester, photos, createdAt, updatedAt]
      properties:
