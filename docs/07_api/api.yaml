  /agent-results/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentResultId'
    patch:
      tags: [Agent]
      operationId: patchAgentResult
      summary: AI 결과물 수정 (규격·법령·안전서류)
      description: |
        ENGINEER 본인 요청만. **전체 치환(PUT-like)** — A1·A2 는 `items`, A3 는 `documents` 배열을 통째로 보낸다.
        추가·삭제·편집을 한 번의 호출로 처리한다 (정합성 메모 #5 · 결정 D-09).

        치환 규칙:
        - 배열에 없는 기존 `itemId` / `docId` → **삭제**
        - id 없이 보낸 항목 → **신규 추가**, 서버가 `i-NN` / `d-NN` 채번, `edited: true`
        - 기존 id 로 보낸 항목 → id·`edited` 를 제외한 나머지 값이 달라졌으면 `edited: true` (한 번 true 면 유지)
        - ⚠️ 서버는 기존 항목과 **병합하지 않는다.** A3 문서는 `docId` · `type` · `name` · `content` 를 모두 보내야 하며,
          `{docId, content}` 만 보내면 `type` · `name` 이 사라진다 (v1.2 #14). FE 는 전체 필드를 보낸다.
        - 항목 하나라도 바뀌면 결과의 `edited: true` → S_02 "엔지니어 수정" 배지. AI 원본은 `original_json` 에 보존.

        에이전트 유형과 다른 키를 보내면 400 (`A3` 에 `items`, `A1`/`A2` 에 `documents`).

        **AC 매핑** 5-2
      x-api-no: 13
      x-screens: [WRA_E_04]
      x-ai-extension-point: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResultPatchRequest'
            examples:
              itemsA1A2:
                summary: A1 / A2 (항목형) — 편집 1 · 유지 1 · 삭제(i-03 미포함) · 추가 1
                value:
                  items:
                    - { itemId: i-01, text: '규격 적합: 3000 psi ≥ 요구 2500 psi' }
                    - { itemId: i-02, text: '대체 호환: SS-8-VCR-2 (벤더 확인 완료)' }
                    - { text: '추가 근거: 사내 표준 STD-VLV-07' }
              documentsA3:
                summary: A3 (문서형) — 전체 필드 전송
                value:
                  documents:
                    - { docId: d-01, type: WORK_PERMIT, name: 작업허가서 초안, content: '작업허가서 초안 본문 (수정됨)…' }
                    - { docId: d-02, type: RISK_ASSESSMENT, name: 위험성평가서 초안, content: '위험성평가서 초안 본문…' }
      responses:
        '200':
          description: 치환 결과. A1·A2 는 `items`, A3 는 `documents` 만 채워진다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResultPatchResponse'
              example:
                agentResultId: 9c10e2b4-5d6e-4f70-8a9b-1c2d3e4f5a61
                agentCode: A2
                edited: true
                items:
                  - { itemId: i-01, text: 수정된 법령, edited: true }
                  - { itemId: i-03, text: 추가 조문, edited: true }
                updatedAt: '2026-09-03T10:19:40+09:00'
        '400':
          description: '`VALIDATION_FAILED` — 에이전트 유형에 맞지 않는 배열 키 · 배열 누락'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-09-03T10:19:40+09:00'
                status: 400
                code: VALIDATION_FAILED
                message: A3 결과는 documents 배열로 수정합니다.
                path: /api/v1/agent-results/2b88c4d6-7e8f-4a90-9b0c-3d4e5f6a7b82
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOwnerOrRole'
        '404':
          description: '`AGENT_RESULT_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`RESULT_LOCKED` — PENDING · APPROVED 상태'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-09-03T10:19:40+09:00'
                status: 409
                code: RESULT_LOCKED
                message: PENDING·APPROVED 상태에서는 결과를 수정할 수 없습니다.
                path: /api/v1/agent-results/9c10e2b4-5d6e-4f70-8a9b-1c2d3e4f5a61

  # ───────────────────────────── Approval ─────────────────────────────
  /approvals:
    post:
      tags: [Approval]
      operationId: decideApproval
      summary: 승인 / 거절 (+ 사유)
      description: |
        SAFETY_MANAGER 전용. `approvals` 에 새 행을 추가(append-only)하고 같은 트랜잭션에서
        `work_requests.status` 를 `APPROVED` / `REJECTED` 로 갱신한다.

        - 화면정의서 v2.0 기준 승인에는 **체크리스트 blocking 이 없다.** 승인은 사유 없이 즉시 처리.
        - 거절은 `reason` 10자 이상 필수 — 요청자(E_05)에게 그대로 전달된다. `reasonCategory` 는 S_01 거절 사유 TOP5 집계 키 (선택, 자유 문자열 — 정합성 메모 #6).
        - 승인 API 는 AI 결과를 입력으로 받지 않는다 (AI 는 제안, 결정은 사람).

        **AC 매핑** 8-2 (승인 201) · 8-3 (사유 미입력 차단) · 8-4 (거절 201)
      x-api-no: 15
      x-screens: [WRA_S_02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecideRequest'
            examples:
              approve:
                summary: 승인
                value:
                  workRequestId: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
                  decision: APPROVE
              reject:
                summary: 거절 (사유 필수)
                value:
                  workRequestId: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
                  decision: REJECT
                  reason: 규격 근거 자료 부족 — 호환표 첨부 요망
                  reasonCategory: 규격 부적합
      responses:
        '201':
          description: 결재 완료. `resultStatus` 는 전이 후 요청 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecideResponse'
        '400':
          description: |
            - `REJECT_REASON_REQUIRED` — REJECT 인데 `reason` 없음 또는 10자 미만
            - `VALIDATION_FAILED` — `workRequestId` / `decision` 누락 · 정의되지 않은 `decision`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-09-03T11:02:00+09:00'
                status: 400
                code: REJECT_REASON_REQUIRED
                message: 거절 사유는 10자 이상 입력해야 합니다.
                path: /api/v1/approvals
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN_ROLE` — ENGINEER 가 호출'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
        '409':
          description: |
            - `ALREADY_DECIDED` — 이미 `APPROVED` / `REJECTED`
            - `NOT_PENDING` — 그 외 `PENDING` 이 아닌 상태 (DRAFT · AI_RUNNING · AI_DONE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────────────────────────── Files ─────────────────────────────
  /files/{workRequestId}/{fileName}:
    get:
      tags: [Files]
      operationId: getFile
      summary: 제품 사진 원본 · 썸네일 정적 서빙
      description: |
        `PhotoResponse.originalUrl` / `thumbnailUrl` 이 가리키는 경로. `<img>` 태그는 Bearer 헤더를 붙일 수 없어 **permitAll**.
        키가 UUID 라 추측 불가. 운영 시 서명 URL 로 전환 (설계문서 10.5).

        `app.upload-dir` (기본 `uploads`, Docker 는 `backend-uploads` 볼륨) 아래 `{workRequestId}/{photoId}.{ext}` 를 그대로 서빙한다.
      x-api-no: null
      x-screens: [WRA_E_02, WRA_S_02]
      security: []
      parameters:
        - name: workRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileName
          in: path
          required: true
          description: '`{photoId}.{ext}`'
          schema:
            type: string
          example: c31a5f2e-8d4b-4a6c-9e1f-2b3c4d5e6f70.jpg
      responses:
        '200':
          description: 이미지 바이너리
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: 파일 없음 (Spring 정적 리소스 기본 404 — `ErrorResponse` 포맷 아님)

# ═════════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `POST /auth/login` 의 `accessToken`. HS256 · `jti` 포함 · 기본 만료 3600초 (`JWT_EXPIRES_IN`).
        로그아웃된 토큰은 401 `TOKEN_REVOKED`.

  # ───────────────────────────── parameters ─────────────────────────────
  parameters:
    WorkRequestId:
      name: id
      in: path
      required: true
      description: '`workRequestId` (UUID). 업무 번호 `requestNo` 가 아니다'
      schema:
        type: string
        format: uuid
      example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 5e77b1c9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
    AgentResultId:
      name: id
      in: path
      required: true
      description: '`agentResultId` — 상세 응답 `agentRun.results[].agentResultId` 또는 폴링 `steps[].agentResultId`'
      schema:
        type: string
        format: uuid
      example: 9c10e2b4-5d6e-4f70-8a9b-1c2d3e4f5a61
    Page:
      name: page
      in: query
      required: false
      description: 0-base 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기 (최대 100 — 초과 시 100 으로 절삭)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: '`필드,asc|desc`. 정렬 가능 필드: `submittedAt` · `createdAt` · `updatedAt` · `status` · `requestNo` 등 `work_requests` 컬럼. 없는 필드는 400'
      schema:
        type: string
        default: submittedAt,desc
      example: submittedAt,desc

  # ───────────────────────────── responses ─────────────────────────────
  responses:
    Unauthorized:
      description: |
        - `TOKEN_INVALID` — 토큰 없음 · 위조
        - `TOKEN_EXPIRED` — 만료
        - `TOKEN_REVOKED` — 로그아웃된 토큰
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-03T10:22:31+09:00'
            status: 401
            code: TOKEN_EXPIRED
            message: 토큰이 만료되었습니다.
            path: /api/v1/auth/me
    ForbiddenOwnerOrRole:
      description: |
        - `FORBIDDEN_ROLE` — SAFETY_MANAGER 가 엔지니어 전용 API 호출
        - `FORBIDDEN_NOT_OWNER` — ENGINEER 가 타인 요청 접근
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-03T10:22:31+09:00'
            status: 403
            code: FORBIDDEN_NOT_OWNER
            message: 본인 요청만 접근할 수 있습니다.
            path: /api/v1/work-requests/9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
    WorkRequestNotFound:
      description: '`WORK_REQUEST_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-03T10:22:31+09:00'
            status: 404
            code: WORK_REQUEST_NOT_FOUND
            message: 요청을 찾을 수 없습니다.
            path: /api/v1/work-requests/00000000-0000-0000-0000-000000000000

  examples:
    ErrValidationFailed:
      value:
        timestamp: '2026-09-03T09:12:31+09:00'
        status: 400
        code: VALIDATION_FAILED
        message: 입력값이 올바르지 않습니다.
        path: /api/v1/auth/signup
        fieldErrors:
          - { field: password, reason: "must be at least 8 characters with letter, digit and special character" }
          - { field: role, reason: must not be null }

  # ───────────────────────────── schemas ─────────────────────────────
  schemas:
    # ── 공통 ──
    ErrorResponse:
      type: object
      description: 모든 4xx·5xx 공통 포맷 (`ErrorResponse.java`). `fieldErrors` 는 400·422 에서만 포함
      required: [timestamp, status, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-03T10:22:31+09:00'
        status:
          type: integer
          example: 422
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: 엔지니어 설명은 제출 시 필수입니다.
        path:
          type: string
          example: /api/v1/work-requests/9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30/submit-approval
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: '요청 필드명. 중첩은 점 표기 (`specJson.pressureRating` · `agentResults.A2`). 쿼리 오류는 파라미터명 (`sort`)'
          example: engineerNote
        reason:
          type: string
          example: must not be blank
    ErrorCode:
      type: string
      description: |
        | 상태 | code | 발생 지점 |
        |---|---|---|
        | 400 | `VALIDATION_FAILED` | 필수 누락 · 형식 오류 · enum 외 값 · 잘못된 `status`/`sort`/`role` 쿼리 |
        | 400 | `PASSWORD_MISMATCH` | 비밀번호 확인 불일치 |
        | 400 | `SPEC_SCHEMA_MISMATCH` | `productType` ↔ `specJson` 필수 키 불일치 |
        | 400 | `REJECT_REASON_REQUIRED` | 거절 사유 없음 · 10자 미만 |
        | 400 | `UNSUPPORTED_FILE_TYPE` | jpg/jpeg/png/webp 외 |
        | 400 | `WORK_REQUEST_INCOMPLETE` | AI 실행 시 필수값 누락 |
        | 401 | `INVALID_CREDENTIALS` | 로그인 실패 |
        | 401 | `TOKEN_EXPIRED` · `TOKEN_INVALID` | 토큰 만료 · 위조 |
        | 401 | `TOKEN_REVOKED` | 로그아웃된 토큰 |
        | 403 | `FORBIDDEN_ROLE` | 역할 불일치 |
        | 403 | `FORBIDDEN_NOT_OWNER` | 타인 요청 · SAFETY_MANAGER 의 미제출 요청 접근 |
        | 404 | `USER_NOT_FOUND` | 토큰 소유자 없음 |
        | 404 | `WORK_REQUEST_NOT_FOUND` | 요청 없음 |
        | 404 | `AGENT_RUN_NOT_FOUND` | run 없음 |
        | 404 | `AGENT_RESULT_NOT_FOUND` | 결과 없음 |
        | 409 | `EMAIL_ALREADY_EXISTS` | 중복 이메일 |
        | 409 | `RUN_ALREADY_IN_PROGRESS` | 진행 중 run 존재 |
        | 409 | `IMMUTABLE_STATUS` | PENDING·APPROVED 에서 요청 수정 · AI 실행 |
        | 409 | `RESULT_LOCKED` | PENDING·APPROVED 에서 결과 수정 |
        | 409 | `ALREADY_DECIDED` | 이미 APPROVED·REJECTED |
        | 409 | `NOT_PENDING` | PENDING 이 아닌 상태에서 결재 |
        | 409 | `PHOTO_LIMIT_EXCEEDED` | 요청당 5장 초과 |
        | 413 | `FILE_TOO_LARGE` | 파일당 10MB 초과 |
        | 422 | `SUBMIT_REQUIRED_FIELD_MISSING` | 제출 전 검증 실패 |
        | 500 | `INTERNAL_ERROR` | 서버 오류 · 파일 저장 실패 |
      enum:
        - VALIDATION_FAILED
        - PASSWORD_MISMATCH
        - SPEC_SCHEMA_MISMATCH
        - REJECT_REASON_REQUIRED
        - UNSUPPORTED_FILE_TYPE
        - WORK_REQUEST_INCOMPLETE
        - INVALID_CREDENTIALS
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - TOKEN_REVOKED
        - FORBIDDEN_ROLE
        - FORBIDDEN_NOT_OWNER
        - USER_NOT_FOUND
        - WORK_REQUEST_NOT_FOUND
        - AGENT_RUN_NOT_FOUND
        - AGENT_RESULT_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - RUN_ALREADY_IN_PROGRESS
        - IMMUTABLE_STATUS
        - RESULT_LOCKED
        - ALREADY_DECIDED
        - NOT_PENDING
        - PHOTO_LIMIT_EXCEEDED
        - FILE_TOO_LARGE
        - SUBMIT_REQUIRED_FIELD_MISSING
        - INTERNAL_ERROR
    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, example: 0, description: 현재 페이지 (0-base) }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 5 }
        totalPages: { type: integer, example: 1 }

    # ── 도메인 enum ──
    Role:
      type: string
      description: |
        | 값 | 화면 표기 | 진입 화면 (`redirectPath`) |
        |---|---|---|
        | `ENGINEER` | 엔지니어 | WRA_E_01 `/home` |
        | `SAFETY_MANAGER` | 안전관리자 | WRA_S_01 `/manage/requests` |
      enum: [ENGINEER, SAFETY_MANAGER]
    WorkRequestStatus:
      type: string
      description: |
        | 값 | 화면 표기 (`statusLabel`) | 의미 | 다음 액션 |
        |---|---|---|---|
        | `DRAFT` | 작성 중 | 임시 저장, AI 미실행 | E_02 이어쓰기 |
        | `AI_RUNNING` | AI 검증중 | 에이전트 3종 중 미완료 존재 | E_03 진행 화면 |
        | `AI_DONE` | 결과 확인 대기 | A1·A2·A3 전부 완료, 미제출 | E_04 결과 수정 |
        | `PENDING` | 승인 대기 | 안전관리자에게 제출됨 | S_02 검토 |
        | `APPROVED` | 승인 | 안전관리자 승인 완료 | 종결 |
        | `REJECTED` | 거절·보완 | 사유와 함께 반려 | E_04 재진입 → 재제출 |

        `AI_DONE` 은 E_03(진행)과 E_04(결과 대기)를 구분하기 위해 신설 (정합성 메모 #2 · 결정 D-09).
      enum: [DRAFT, AI_RUNNING, AI_DONE, PENDING, APPROVED, REJECTED]
    ProductType:
      type: string
      description: |
        제품 유형. `specJson` 은 유형별 필수 키가 다르며 서버가 검증한다 (누락 시 400 `SPEC_SCHEMA_MISMATCH`).

        | `productType` | 화면 표기 (`productTypeLabel`) | `specJson` 필수 키 | 예시 |
        |---|---|---|---|
        | `VALVE` | 밸브 | `pressureRating` | `{"pressureRating":"3000 psi"}` |
        | `FITTING_TUBE` | 피팅·튜브 | `connectionStandard`, `material` | `{"connectionStandard":"1/4 in VCR","material":"SUS316L"}` |
        | `REGULATOR` | 레귤레이터 | `pressureRating` | `{"pressureRating":"250 psi"}` |
        | `FILTER` | 필터 | `substanceType` | `{"substanceType":"N2"}` |
        | `ETC` | 기타 | `freeSpec` | `{"freeSpec":"씰킷 세트, 내열 200℃"}` |

        FE 내부 키(`pressure_rating` · `connection_spec` · `substance_type` · `free_spec`)는 `normalize.js` 에서 위 키로 변환한다.
      enum: [VALVE, FITTING_TUBE, REGULATOR, FILTER, ETC]
    AgentCode:
      type: string
      description: |
        AI 검증 3종 (PoC 전부 Mock). 응답의 `title` 은 서버 고정값.

        - `A1` — 규격·호환 (입력 스펙 기반). 부품 마스터·호환표 연동은 Phase 2
        - `A2` — 적용 법령 (조문). 법령 RAG 는 Phase 2
        - `A3` — 안전서류 초안 (작업허가서 · 위험성평가서 2종 고정)

        A4 벤더 에이전트는 Phase 2.
      enum: [A1, A2, A3]
    AgentStepStatus:
      type: string
      description: '`WAITING` 대기 → `RUNNING` 실행 중 → `DONE` 완료 / `FAILED` 실패 (재시도 대상 · 현재 Mock 은 만들지 않음)'
      enum: [WAITING, RUNNING, DONE, FAILED]
    RunStatus:
      type: string
      description: '`agent_runs.status`. 3 step 모두 DONE 이면 `DONE`'
      enum: [RUNNING, DONE, FAILED]
    ApprovalDecision:
      type: string
      description: '`APPROVE` 승인 · `REJECT` 거절 (`reason` 10자 이상 필수)'
      enum: [APPROVE, REJECT]

    # ── Auth ──
    SignupRequest:
      type: object
      required: [name, email, password, passwordConfirm, role]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
          example: 홍길동
        email:
          type: string
          format: email
          description: 로그인 ID. 유니크
          example: hong@company.com
        password:
          type: string
          format: password
          description: 8자 이상 · 영문 + 숫자 + 특수문자 각 1개 이상 (`^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$`)
          example: Passw0rd!23
        passwordConfirm:
          type: string
          format: password
          description: '`password` 와 일치. 저장하지 않음'
          example: Passw0rd!23
        role:
          $ref: '#/components/schemas/Role'
    SignupResponse:
      type: object
      required: [userId, name, email, role, createdAt]
      properties:
        userId: { type: string, format: uuid, example: 8b0d2f14-6c2e-4a71-9d33-1e5a7c9b0f22 }
        name: { type: string, example: 홍길동 }
        email: { type: string, format: email, example: hong@company.com }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time, example: '2026-09-03T09:12:00+09:00' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: engineer@fixguide.dev }
        password: { type: string, format: password, example: Passw0rd!23 }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user, redirectPath]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI4YjBkLi4uIiwianRpIjoiLi4uIn0.sig
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: 초 단위 만료 (`app.jwt.expires-in-seconds`)
          example: 3600
        user:
          type: object
          required: [userId, name, role]
          properties:
            userId: { type: string, format: uuid, example: 8b0d2f14-6c2e-4a71-9d33-1e5a7c9b0f22 }
            name: { type: string, example: 이엔지 }
            role: { $ref: '#/components/schemas/Role' }
        redirectPath:
          type: string
          description: '역할별 진입 경로 — `ENGINEER` → `/home`, `SAFETY_MANAGER` → `/manage/requests` (AC 0-2)'
          example: /home
    MeResponse:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string, format: uuid, example: 8b0d2f14-6c2e-4a71-9d33-1e5a7c9b0f22 }
        name: { type: string, example: 이엔지 }
        email: { type: string, format: email, example: engineer@fixguide.dev }
        role: { $ref: '#/components/schemas/Role' }

    # ── Dashboard ──
    DashboardSummaryResponse:
      type: object
      required: [role, kpi]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        kpi:
          description: 역할에 따라 `EngineerKpi` 또는 `SafetyKpi`
          oneOf:
            - $ref: '#/components/schemas/EngineerKpi'
            - $ref: '#/components/schemas/SafetyKpi'
        rejectReasonTop5:
          type: array
          description: '`role=safety` 에서만. 이번 달 REJECT 건의 `reasonCategory` 상위 5개 (null 카테고리 제외). 없으면 빈 배열'
          items:
            $ref: '#/components/schemas/RejectReasonCount'
    EngineerKpi:
      type: object
      description: 엔지니어 메인(E_01) KPI — 본인 요청의 상태별 건수. v2.0 에서 "평균 승인 소요시간" 제거
      required: [draft, aiRunning, pending, rejected]
      properties:
        draft: { type: integer, format: int64, example: 2, description: DRAFT }
        aiRunning: { type: integer, format: int64, example: 1, description: AI_RUNNING }
        pending: { type: integer, format: int64, example: 3, description: PENDING }
        rejected: { type: integer, format: int64, example: 1, description: REJECTED }
    SafetyKpi:
      type: object
      description: 안전관리자 메인(S_01) KPI
      required: [pending, processedToday, approvedThisMonth, rejectedThisMonth]
      properties:
        pending: { type: integer, format: int64, example: 5, description: 전체 PENDING 건수 }
        processedToday: { type: integer, format: int64, example: 7, description: 오늘 00:00 이후 결재 건수 }
        approvedThisMonth: { type: integer, format: int64, example: 42, description: 이번 달 1일 이후 APPROVE }
        rejectedThisMonth: { type: integer, format: int64, example: 6, description: 이번 달 1일 이후 REJECT }
    RejectReasonCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string, example: 규격 부적합 }
        count: { type: integer, format: int64, example: 9 }

    # ── WorkRequest ──
    OperatingCondition:
      type: object
      description: |
        운전 조건. 키는 자유 형식 (`temperature` · `pressure` · `flowRate` …). FE 가 문자열 하나로 보내면 `{ "note": "..." }`
      additionalProperties:
        type: string
      example: { temperature: 80 ℃, pressure: 2500 psi }
    SpecJson:
      type: object
      description: '`productType` 별 필수 키가 다른 자유 객체. 필수 키는 `ProductType` 스키마 참조'
      additionalProperties: true
      example: { pressureRating: 3000 psi }
    WorkRequestCreateRequest:
      type: object
      description: '`Y*` = `draft=false` 일 때만 필수. `draft=true` 면 전부 선택'
      properties:
        equipment: { type: string, maxLength: 100, description: '설비 (Y*)', example: 펌프 P-114 }
        line: { type: string, maxLength: 100, description: '라인 (Y*)', example: A라인 }
        substance: { type: string, maxLength: 100, description: '취급 물질 (Y*) — A2 입력', example: H2SO4 }
        operatingCondition:
          allOf:
            - $ref: '#/components/schemas/OperatingCondition'
          description: '운전 조건 (Y*)'
        productName: { type: string, maxLength: 200, description: '제품명 (Y*) — AI 전송 핵심 값', example: SS-8-VCR }
        productType:
          allOf:
            - $ref: '#/components/schemas/ProductType'
          description: '제품 유형 (Y*)'
        specJson:
          allOf:
            - $ref: '#/components/schemas/SpecJson'
          description: '유형별 스펙 (Y*)'
        symptom: { type: string, description: 고장 증상, example: "씰 누유 발생, 압력 유지 불가" }
        siteMemo: { type: string, description: 현장 확인 메모, example: 09-02 정기점검 중 확인 }
        draft:
          type: boolean
          default: false
          description: '`true` 면 필수 검증 생략. 어느 쪽이든 저장 상태는 `DRAFT`'
    WorkRequestCreateResponse:
      type: object
      required: [workRequestId, requestNo, status, createdAt]
      properties:
        workRequestId: { type: string, format: uuid, example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        requestNo:
          type: string
          pattern: '^WR-\d{8}-\d{3}$'
          description: 업무 번호. 서버 채번 (당일 최대 일련번호 + 1)
          example: WR-20260903-001
        status: { $ref: '#/components/schemas/WorkRequestStatus' }
        createdAt: { type: string, format: date-time, example: '2026-09-03T10:05:00+09:00' }
    NextAction:
      type: object
      description: |
        상태별 다음 화면 (AC 2-4 / 6-5). 서버 계산값 (`NextAction.java`).

        | viewer | status | label | path |
        |---|---|---|---|
        | SAFETY_MANAGER | 전부 | 상세 | `/manage/requests/{id}` |
        | ENGINEER | DRAFT | 이어서 | `/requests/{id}/edit` |
        | ENGINEER | AI_RUNNING | 진행 | `/requests/{id}/progress` |
        | ENGINEER | AI_DONE | 결과 | `/requests/{id}/result` |
        | ENGINEER | 그 외 | 상세 | `/requests/{id}` |

        ⚠️ ENGINEER 의 `/edit` · `/progress` · `/requests/{id}` 는 FE 라우터에 없다 (FE: `/requests/:id/run` · `/my/requests`). FE 는 현재 이 값을 사용하지 않는다.
      required: [label, path]
      properties:
        label: { type: string, example: 상세 }
        path: { type: string, example: /manage/requests/9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
    WorkRequestSummary:
      type: object
      description: 목록 항목 (`WorkRequestSummaryResponse.java`). DRAFT 는 `productType` · `productTypeLabel` · `submittedAt` 이 null 일 수 있어 생략됨
      required: [workRequestId, requestNo, status, statusLabel, requesterName, createdAt, nextAction]
      properties:
        workRequestId: { type: string, format: uuid, example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        requestNo: { type: string, example: WR-20260903-001 }
        equipment: { type: string, example: 펌프 P-114 }
        partName: { type: string, description: '= `productName`', example: SS-8-VCR }
        productType: { $ref: '#/components/schemas/ProductType' }
        productTypeLabel: { type: string, example: 밸브 }
        status: { $ref: '#/components/schemas/WorkRequestStatus' }
        statusLabel: { type: string, example: 승인 대기 }
        requesterName: { type: string, example: 이엔지 }
        createdAt: { type: string, format: date-time, example: '2026-09-03T10:05:00+09:00' }
        submittedAt: { type: string, format: date-time, nullable: true, description: "PENDING 전환 시각. 재제출 시 갱신. 기본 정렬 키", example: '2026-09-03T10:22:00+09:00' }
        nextAction: { $ref: '#/components/schemas/NextAction' }
    WorkRequestListResponse:
