              documents:
                - { docId: d-01, type: WORK_PERMIT, name: 작업허가서 초안, content: '…', edited: false }
                - { docId: d-02, type: RISK_ASSESSMENT, name: 위험성평가서 초안, content: '…', edited: false }
        approval:
          decision: REJECT
          reason: 규격 근거 자료 부족 — 호환표 첨부 요망
          reasonCategory: 규격 부적합
          decidedBy: 박안전
          decidedAt: '2026-09-02T18:40:00+09:00'
        createdAt: '2026-09-03T10:05:00+09:00'
        updatedAt: '2026-09-03T10:22:00+09:00'
        submittedAt: '2026-09-03T10:22:00+09:00'
    AgentRunView:
      type: object
      required: [runId, status, results]
      properties:
        runId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        results:
          type: array
          description: '`agentCode` 순. AI_RUNNING 중에는 완료된 step 의 결과만 포함'
          items:
            $ref: '#/components/schemas/AgentResultView'
    AgentResultView:
      type: object
      description: A1·A2 는 `items`, A3 는 `documents` 만 채워진다 (다른 쪽은 생략)
      required: [agentResultId, agentCode, title, editable, edited]
      properties:
        agentResultId: { type: string, format: uuid }
        agentCode: { $ref: '#/components/schemas/AgentCode' }
        title: { type: string, example: 규격·호환 }
        editable:
          type: boolean
          description: 본인 요청 + 상태가 PENDING·APPROVED 가 아닐 때만 true. SAFETY_MANAGER 는 항상 false
        edited:
          type: boolean
          description: 항목 중 하나라도 수정·추가·삭제됐으면 true → S_02 "엔지니어 수정" 배지
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentResultItem'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AgentResultDocument'
    AgentResultItem:
      type: object
      description: A1·A2 항목형 (`payload_json.items[]`). `docs/05_ai_ready/schemas/a1.items.schema.json` · `a2.items.schema.json` 과 동일
      required: [itemId, text, edited]
      properties:
        itemId: { type: string, pattern: '^i-\d{2,}$', example: i-01, description: 서버 채번 }
        text: { type: string, example: '규격 적합: 3000 psi ≥ 요구 2500 psi' }
        edited: { type: boolean, example: false }
    AgentResultDocument:
      type: object
      description: A3 문서형 (`payload_json.documents[]`). `docs/05_ai_ready/schemas/a3.documents.schema.json` 과 동일. 2건 고정
      required: [docId, type, name, content, edited]
      properties:
        docId: { type: string, pattern: '^d-\d{2,}$', example: d-01 }
        type:
          type: string
          enum: [WORK_PERMIT, RISK_ASSESSMENT]
          description: "서버는 enum 을 강제하지 않지만 설계상 2종 고정. 항목 추가 시 type 미지정은 스키마 위반 (설계문서 16.1 #2)"
        name: { type: string, example: 작업허가서 초안 }
        content: { type: string, description: 마크다운 본문 }
        edited: { type: boolean, example: false }
    ApprovalView:
      type: object
      required: [decision, decidedBy, decidedAt]
      properties:
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        reason: { type: string, nullable: true, description: REJECT 사유. APPROVE 는 null → 생략 }
        reasonCategory: { type: string, nullable: true, example: 규격 부적합 }
        decidedBy: { type: string, description: 안전관리자 이름, example: 박안전 }
        decidedAt: { type: string, format: date-time }
    WorkRequestPatchRequest:
      type: object
      description: 변경할 필드만 전송. `specJson` 은 통째로 교체
      properties:
        equipment: { type: string, maxLength: 100 }
        line: { type: string, maxLength: 100 }
        substance: { type: string, maxLength: 100 }
        operatingCondition: { $ref: '#/components/schemas/OperatingCondition' }
        productName: { type: string, maxLength: 200 }
        productType: { $ref: '#/components/schemas/ProductType' }
        specJson: { $ref: '#/components/schemas/SpecJson' }
        symptom: { type: string }
        siteMemo: { type: string }
        engineerNote: { type: string, description: 엔지니어 설명. 제출 시 필수 }
    WorkRequestPatchResponse:
      type: object
      required: [workRequestId, status, updatedAt]
      properties:
        workRequestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkRequestStatus' }
        updatedAt: { type: string, format: date-time, example: '2026-09-03T10:20:11+09:00' }
    WorkRequestSubmitRequest:
      type: object
      properties:
        engineerNote:
          type: string
          description: 엔지니어 설명. 비우면 기존 저장값 사용, 둘 다 없으면 422
          example: 압력 등급 상향 반영, 제38조 작업허가 필요 판단. 대체품 SS-8-VCR-2 확인 완료.
    WorkRequestSubmitResponse:
      type: object
      required: [workRequestId, status, submittedAt]
      properties:
        workRequestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkRequestStatus', description: 항상 PENDING }
        submittedAt: { type: string, format: date-time, example: '2026-09-03T10:22:00+09:00' }

    # ── Photo ──
    Photo:
      type: object
      required: [photoId, fileName, size, thumbnailUrl, originalUrl, uploadedAt]
      properties:
        photoId: { type: string, format: uuid, example: c31a5f2e-8d4b-4a6c-9e1f-2b3c4d5e6f70 }
        fileName: { type: string, description: 원본 파일명, example: valve_front.jpg }
        size: { type: integer, description: bytes, example: 842113 }
        thumbnailUrl:
          type: string
          description: '`/api/v1/files/{workRequestId}/{photoId}.{ext}` 상대경로. FE 는 `VITE_API_BASE_URL` 을 앞에 붙인다. 현재 원본과 동일 (썸네일 미구현)'
          example: /api/v1/files/9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30/c31a5f2e-8d4b-4a6c-9e1f-2b3c4d5e6f70.jpg
        originalUrl:
          type: string
          example: /api/v1/files/9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30/c31a5f2e-8d4b-4a6c-9e1f-2b3c4d5e6f70.jpg
        uploadedAt: { type: string, format: date-time, example: '2026-09-03T10:10:00+09:00' }
    PhotoListResponse:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'

    # ── Agent ──
    AgentRunStartRequest:
      type: object
      required: [workRequestId]
      properties:
        workRequestId: { type: string, format: uuid, example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        agents:
          type: array
          description: '실행할 에이전트. ⚠️ 현재 무시되며 항상 A1·A2·A3 전부 실행 (Phase 2)'
          items:
            $ref: '#/components/schemas/AgentCode'
          example: [A1, A2, A3]
    AgentStep:
      type: object
      description: E_03 카드 하나 = step 하나 (`agent_steps`). 202 응답에서는 `message` · `agentResultId` · `startedAt` · `finishedAt` 이 null
      required: [agentCode, title, status]
      properties:
        agentCode: { $ref: '#/components/schemas/AgentCode' }
        title: { type: string, example: 규격·호환 }
        status: { $ref: '#/components/schemas/AgentStepStatus' }
        message: { type: string, nullable: true, description: 카드 진행 메시지, example: 관련 조문 검색 중… }
        agentResultId: { type: string, format: uuid, nullable: true, description: "DONE 이후 채워짐. `PATCH /agent-results/{id}` 대상" }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AgentRunStartResponse:
      type: object
      required: [runId, workRequestId, status, steps, pollIntervalMs]
      properties:
        runId: { type: string, format: uuid, example: 5e77b1c9-1a2b-4c3d-8e9f-0a1b2c3d4e5f }
        workRequestId: { type: string, format: uuid, example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        status: { $ref: '#/components/schemas/RunStatus' }
        steps:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentStep'
        pollIntervalMs: { type: integer, example: 2500, description: "프론트 폴링 주기 (정합성 메모 #9)" }
      example:
        runId: 5e77b1c9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        workRequestId: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
        status: RUNNING
        steps:
          - { agentCode: A1, title: 규격·호환, status: WAITING, message: null, agentResultId: null, startedAt: null, finishedAt: null }
          - { agentCode: A2, title: 적용 법령, status: WAITING, message: null, agentResultId: null, startedAt: null, finishedAt: null }
          - { agentCode: A3, title: 안전서류 초안, status: WAITING, message: null, agentResultId: null, startedAt: null, finishedAt: null }
        pollIntervalMs: 2500
    AgentRunPollResponse:
      type: object
      required: [runId, workRequestId, status, startedAt, steps, allDone, pollIntervalMs]
      properties:
        runId: { type: string, format: uuid }
        workRequestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        startedAt: { type: string, format: date-time }
        steps:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentStep'
        allDone:
          type: boolean
          description: 3 step 모두 DONE. true 가 되는 호출에서 서버가 요청을 AI_DONE 으로 전환한다
        pollIntervalMs: { type: integer, example: 2500 }
    AgentResultPatchRequest:
      type: object
      description: |
        A1·A2 → `items` / A3 → `documents` 중 하나만. 배열 전체 치환.
        id 를 생략하면 신규 추가(서버 채번). `edited` 는 서버가 계산하므로 보내도 무시된다.
      properties:
        items:
          type: array
          items:
            type: object
            required: [text]
            properties:
              itemId: { type: string, description: 기존 항목 id. 생략 시 신규, example: i-01 }
              text: { type: string, example: '규격 적합: 3000 psi ≥ 요구 2500 psi' }
        documents:
          type: array
          items:
            type: object
            required: [type, name, content]
            properties:
              docId: { type: string, description: 기존 문서 id. 생략 시 신규, example: d-01 }
              type: { type: string, enum: [WORK_PERMIT, RISK_ASSESSMENT] }
              name: { type: string, example: 작업허가서 초안 }
              content: { type: string }
    AgentResultPatchResponse:
      type: object
      description: 치환 후 전체 배열. A1·A2 는 `items`, A3 는 `documents` 만
      required: [agentResultId, agentCode, edited, updatedAt]
      properties:
        agentResultId: { type: string, format: uuid }
        agentCode: { $ref: '#/components/schemas/AgentCode' }
        edited: { type: boolean }
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentResultItem'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AgentResultDocument'
        updatedAt: { type: string, format: date-time }

    # ── Approval ──
    ApprovalDecideRequest:
      type: object
      required: [workRequestId, decision]
      properties:
        workRequestId: { type: string, format: uuid, example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        reason:
          type: string
          minLength: 10
          description: REJECT 시 필수 (공백 제거 후 10자 이상). APPROVE 시 무시(저장 안 함). 요청자(E_05)에게 그대로 전달
          example: 규격 근거 자료 부족 — 호환표 첨부 요망
        reasonCategory:
          type: string
          maxLength: 50
          description: "거절 사유 분류 (S_01 TOP5 집계 키). 자유 문자열 — 5종 고정 여부는 정합성 메모 #6"
          example: 규격 부적합
    ApprovalDecideResponse:
      type: object
      required: [approvalId, workRequestId, decision, resultStatus, decidedBy, decidedAt]
      properties:
        approvalId: { type: string, format: uuid, example: 77103c9e-2f4a-4b5c-8d6e-9f0a1b2c3d4e }
        workRequestId: { type: string, format: uuid, example: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30 }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        reason: { type: string, nullable: true, description: APPROVE 는 생략 }
        reasonCategory: { type: string, nullable: true }
        resultStatus:
          allOf:
            - $ref: '#/components/schemas/WorkRequestStatus'
          description: 전이 후 요청 상태 — `APPROVED` / `REJECTED`
        decidedBy: { type: string, example: 박안전 }
        decidedAt: { type: string, format: date-time, example: '2026-09-03T11:02:00+09:00' }
      example:
        approvalId: 77103c9e-2f4a-4b5c-8d6e-9f0a1b2c3d4e
        workRequestId: 9f1c8a02-77b5-4e0a-9c31-2a4d6f8e1b30
        decision: REJECT
        reason: 규격 근거 자료 부족 — 호환표 첨부 요망
        reasonCategory: 규격 부적합
        resultStatus: REJECTED
        decidedBy: 박안전
        decidedAt: '2026-09-03T11:02:00+09:00'
