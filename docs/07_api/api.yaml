openapi: 3.0.3

# ─────────────────────────────────────────────────────────────────────────────
# Argus (FixGuide) REST API — OpenAPI 명세
#
# 기준: docs/07_api/README.md (WRA API 명세서 v1.1) · Argus 설계문서 v1.0 12장 · docs/06_erd/erd.md
#       · backend/src/main/java/com/skala/fixguide/**  (컨트롤러·DTO·서비스 — 코드가 정본)
#       · frontend/src/api/**                          (호출 측 계약)
#
# README v1.1 과 다른 점은 info.description "v1.2 변경 이력" 에 모아 두었다.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Argus (FixGuide) API
  version: 1.2.0
  description: |
    **REQ-F-0001 · 반도체 팹 협력사 부품 교체 요청·승인 AI-Ready 워크플로우**

    설비 엔지니어가 부품 교체를 요청하면 AI 에이전트 3종(A1 규격·호환 / A2 법령·조문 / A3 안전서류)이
    검토 초안을 만들고, 엔지니어가 수정해 제출하면 안전관리자가 승인·거절한다. **AI는 제안까지, 결정은 사람이 한다.**

    ---
    ## 공통 규약

    | 항목 | 규약 |
    |---|---|
    | Base URL | `/api/v1` (servers 참조) |
    | 인증 | JWT Bearer — `Authorization: Bearer {accessToken}`. `POST /auth/signup` · `POST /auth/login` · `GET /files/**` 제외 전 API 필수 |
    | Content-Type | `application/json; charset=utf-8` (사진 업로드만 `multipart/form-data`) |
    | 시각 | ISO 8601 · KST 오프셋 — `2026-09-03T10:22:00+09:00` (서버 jackson time-zone Asia/Seoul) |
    | ID | UUID v4 문자열. 업무 번호는 `requestNo` (`WR-YYYYMMDD-NNN`, 서버 채번) |
    | 페이지네이션 | `page` (0-base, 기본 0) · `size` (기본 20, 최대 100). 응답에 `page` 객체 포함 |
    | 정렬 | `sort=필드,asc\|desc` — 기본 `submittedAt,desc`. 엔티티에 없는 필드는 400 `VALIDATION_FAILED` (`fieldErrors[].field = sort`) |
    | 권한 | `ENGINEER` 는 본인 요청만 조회·수정 / `SAFETY_MANAGER` 는 `PENDING` 이후(PENDING·APPROVED·REJECTED) 요청 전체 조회·승인. 위반 시 403 |
    | 에러 | 모든 4xx·5xx 는 `ErrorResponse` 단일 포맷. `fieldErrors` 는 입력 검증 오류(400·422)에서만 포함 |

    ## 상태 전이 (`work_requests.status`)

    ```
    DRAFT ──POST /agent-runs──▶ AI_RUNNING ──3 step DONE──▶ AI_DONE ──PATCH submit-approval──▶ PENDING ──POST /approvals──▶ APPROVED
                                                                                                    ▲                          └──▶ REJECTED
                                                                                                    └────── 수정 후 재제출 ─────────────┘
    ```

    | 전이 | 트리거 | 조건 · 오류 |
    |---|---|---|
    | — → DRAFT | `POST /work-requests` | `draft=true` 면 필수 검증 생략. `draft=false` 여도 **상태는 DRAFT** 로 저장 (필수·스펙 검증만 수행) |
    | DRAFT → AI_RUNNING | `POST /agent-runs` | 필수값 누락 400 `WORK_REQUEST_INCOMPLETE` · 진행 중 run 409 `RUN_ALREADY_IN_PROGRESS` · PENDING/APPROVED 409 `IMMUTABLE_STATUS` |
    | AI_RUNNING → AI_DONE | `GET /agent-runs/{runId}` 마지막 폴링 (`allDone: true`) | 서버가 전환 |
    | AI_DONE / REJECTED → PENDING | `PATCH /work-requests/{id}/submit-approval` | 3종 결과 존재 · `engineerNote` · A2 항목 1건 이상. 아니면 422 |
    | PENDING → APPROVED / REJECTED | `POST /approvals` | SAFETY_MANAGER 만(403) · PENDING 아니면 409 · REJECT 사유 10자 미만 400 |
    | PENDING · APPROVED | 수정 불가 | `PATCH /work-requests` 409 `IMMUTABLE_STATUS` · `PATCH /agent-results` 409 `RESULT_LOCKED` |

    ## AI 검증 — Mock 상태머신 (PoC)

    `POST /agent-runs` 는 run 1건 + step 3건(WAITING)을 만들고 202 를 돌려준다. 실제 LLM 호출은 없고,
    **`GET /agent-runs/{runId}` 를 호출할 때마다 미완료 step 하나가 DONE 으로 전이하며 결과(`agent_results`)가 생성**된다.
    세 번 폴링하면 `allDone: true` 와 함께 요청이 `AI_DONE` 으로 전환된다. 실제 LLM 전환 시 `MockAgentEngine` 만 교체하며
    202 + 폴링 계약은 그대로 유지된다 (설계문서 9.4).

    ## v1.2 변경 이력 (README v1.1 → 코드 대조 반영, 2026-09-04)

    응답 포맷이 바뀌는 것은 없고, 코드에 이미 있으나 README 에 빠져 있던 필드·오류를 채웠다.

    | # | 항목 | 내용 |
    |---|---|---|
    | 1 | `requestNo` | `POST /work-requests` 201 · 목록 `content[]` · 상세 응답에 포함 (ERD 반영) |
    | 2 | 목록 응답 | `createdAt` 추가 |
    | 3 | 상세 응답 | `statusLabel` · `productTypeLabel` · `updatedAt` · `agentRun.results[].edited` · `approval.reasonCategory` 추가 |
    | 4 | 승인 응답 | `reasonCategory` 추가 |
    | 5 | step 응답 | `title` · `startedAt` 추가 |
    | 6 | 사진 URL | 절대 URL 이 아니라 `/api/v1/files/{workRequestId}/{photoId}.{ext}` 상대경로. 현재 `thumbnailUrl == originalUrl` (썸네일·EXIF 제거 미구현 — Phase 2) |
    | 7 | `POST /work-requests` | `draft=false` 여도 상태는 `DRAFT`. AI 실행 시점에 `AI_RUNNING` 으로 전환 |
    | 8 | `submit-approval` | 요청 본문 선택. 비우면 저장된 `engineerNote` 사용, 둘 다 없으면 422. `fieldErrors[].field` = `status` · `engineerNote` · `agentResults` · `agentResults.A2` |
    | 9 | 에러 코드 | `WORK_REQUEST_INCOMPLETE`(400) · `USER_NOT_FOUND` · `AGENT_RESULT_NOT_FOUND`(404) · `PHOTO_LIMIT_EXCEEDED`(409) 를 공통 표에 추가 |
    | 10 | API별 오류 보강 | 목록: SAFETY_MANAGER + `mine=true` 403, 잘못된 `status`/`sort` 400 · 대시보드: `role` 값 오류 400 · agent-runs: 409 `IMMUTABLE_STATUS` · agent-results: 잘못된 배열 키 400, 404 |
    | 11 | 대시보드 TOP5 | **이번 달** 거절 건 기준 집계로 명시 |
    | 12 | 목록 `mine` | ENGINEER 는 `mine` 값과 무관하게 항상 본인 요청만 반환 |
    | 13 | `GET /files/**` | 제품 사진 정적 서빙 경로를 명세에 추가 (permitAll) |
    | 14 | A3 문서 수정 | `documents[]` 는 `docId` · `type` · `name` · `content` **전체 필드 전송** (서버는 병합하지 않고 치환). README 의 `{docId, content}` 부분 전송 예시는 폐기 |
    | 15 | `nextAction.path` | BE 가 내려주는 경로(`/requests/{id}/edit` 등)가 FE 라우터와 불일치. FE 는 현재 `nextAction` 을 사용하지 않고 자체 분기. 값은 BE 현재값 그대로 기술 |
    | 16 | 알려진 한계 | `POST /agent-runs` 의 `agents` 는 현재 무시(항상 3종 실행) · FAILED step 의 `errorMessage` 는 DTO 미구현 — 둘 다 Phase 2 |

  contact:
    name: API Architect · Backend (정구현)
    url: https://github.com/Taeyum/skala-fixguide
  license:
    name: Internal (SKALA 4기 미니프로젝트)
    url: https://github.com/Taeyum/skala-fixguide

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 · Docker Compose (backend:8080)

tags:
  - name: Auth
    description: 회원가입 · 로그인 · 로그아웃 · 내 정보 (화면 WRA_C_00 · C_01 · 공통 GNB)
  - name: Dashboard
    description: 역할별 메인 KPI (화면 WRA_E_01 · S_01)
  - name: WorkRequest
    description: 부품 교체 요청 등록 · 목록 · 상세 · 수정 · 제출 (화면 WRA_E_01 ~ E_05 · S_01 · S_02)
  - name: Photo
    description: 제품 사진 업로드 · 열람 (화면 WRA_E_02 · S_02)
  - name: Agent
    description: AI 검증 3종 실행 · 폴링 · 결과 수정 (화면 WRA_E_02 · E_03 · E_04) — AI 확장 지점
  - name: Approval
    description: 안전관리자 승인 · 거절 (화면 WRA_S_02)
  - name: Files
    description: 업로드된 제품 사진 정적 서빙 (인증 불필요)

security:
  - bearerAuth: []

# ═════════════════════════════════════════════════════════════════════════════
paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: 회원가입
      description: |
        역할(`ENGINEER` · `SAFETY_MANAGER`) 선택이 필수다. `passwordConfirm` 은 검증에만 쓰고 저장하지 않는다.
        비밀번호는 bcrypt 해시로만 저장한다.

        **AC 매핑** 1-4 (201) · 1-5 (409) · 1-2 / 1-3 (400)
      x-api-no: 1
      x-screens: [WRA_C_01]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: |
            - `VALIDATION_FAILED` — 필수 항목 누락 · 형식 오류 · 정의되지 않은 `role` 값 (`fieldErrors` 포함)
            - `PASSWORD_MISMATCH` — `password` ≠ `passwordConfirm`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ErrValidationFailed'
                passwordMismatch:
                  value:
                    timestamp: '2026-09-03T09:12:31+09:00'
                    status: 400
                    code: PASSWORD_MISMATCH
                    message: 비밀번호와 비밀번호 확인이 일치하지 않습니다.
                    path: /api/v1/auth/signup
        '409':
          description: '`EMAIL_ALREADY_EXISTS` — 중복 이메일'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-09-03T09:12:31+09:00'
                status: 409
                code: EMAIL_ALREADY_EXISTS
                message: 이미 사용 중인 이메일입니다.
                path: /api/v1/auth/signup

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인 · 역할별 진입 경로 반환
      description: |
        성공 시 `accessToken` 과 역할별 `redirectPath` 를 돌려준다. 프론트는 이 값을 그대로 사용한다.

        - `ENGINEER` → `/home` (WRA_E_01)
        - `SAFETY_MANAGER` → `/manage/requests` (WRA_S_01)

        이메일이 없거나 비밀번호가 틀려도 구분하지 않고 401 `INVALID_CREDENTIALS` (계정 존재 여부 노출 방지 · AC 0-3).
      x-api-no: 2
      x-screens: [WRA_C_00]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: '`VALIDATION_FAILED` — 이메일 형식 오류 · 빈 값'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`INVALID_CREDENTIALS` — 자격 증명 불일치'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-09-03T09:12:31+09:00'
                status: 401
                code: INVALID_CREDENTIALS
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
                path: /api/v1/auth/login

  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: 내 정보 조회
      description: |
        새로고침·직접 URL 진입 시 역할별 GNB 렌더링용. 화면정의서 AC 에는 없으나 필요해 신설 (정합성 메모 #3).
      x-api-no: 3
      x-screens: [공통]
      responses:
        '200':
          description: 토큰 소유자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`USER_NOT_FOUND` — 토큰의 userId 에 해당하는 계정이 없음 (삭제된 계정)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 (현재 토큰 무효화)
      description: |
        `Authorization` 헤더로 보낸 액세스 토큰의 `jti` 를 **원래 만료 시각까지 블랙리스트에 등록**해 즉시 무효화한다.
        요청 본문은 없다. 화면정의서 AC 에는 없으나 GNB 에 필요해 v1.1 에서 신설 (정합성 메모 #11).

        - 무효화 단위는 토큰 1개. 다른 기기의 세션은 유지된다.
        - 저장소는 `app.auth.token-blacklist.type` 설정으로 전환 — `redis` (운영, TTL) / `memory` (로컬·테스트 기본).
        - Redis 를 켜면 인증이 필요한 모든 요청이 Redis 조회 1회를 거친다 (stateless JWT 이점 일부 반납).
      x-api-no: 16
      x-screens: [공통 GNB]
      responses:
        '204':
          description: 로그아웃 완료 (본문 없음)
        '401':
          description: |
            - `TOKEN_INVALID` — 토큰 없음 · 위조
            - `TOKEN_EXPIRED` — 이미 만료된 토큰
            - `TOKEN_REVOKED` — 이미 로그아웃된 토큰으로 재호출
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-09-03T09:12:31+09:00'
                status: 401
                code: TOKEN_REVOKED
                message: 로그아웃된 토큰입니다. 다시 로그인해 주세요.
                path: /api/v1/auth/logout

  # ───────────────────────────── Dashboard ─────────────────────────────
  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: dashboardSummary
      summary: 역할별 대시보드 요약 (KPI · 거절 사유 TOP5)
      description: |
        `role` 쿼리는 토큰의 역할과 일치해야 한다. 응답 `kpi` 는 역할에 따라 `EngineerKpi` / `SafetyKpi` 중 하나.

        - `role=engineer` → 본인 요청의 상태별 건수 (`draft` · `aiRunning` · `pending` · `rejected`)
        - `role=safety` → 승인 대기 · 오늘 처리 · 이번 달 승인/거절 + **이번 달** 거절 사유 TOP5 (`approvals.reason_category` 집계)

        화면정의서 v2.0 에서 "평균 승인 소요시간" · "에이전트 진행률" 은 제거되어 응답에 없다.

        **AC 매핑** 2-1 (엔지니어 KPI) · 7-1 / 7-3 (안전관리자 KPI + TOP5)
      x-api-no: 4
      x-screens: [WRA_E_01, WRA_S_01]
      parameters:
        - name: role
          in: query
          required: true
          description: '`engineer` | `safety` (대소문자 무관). 토큰 역할과 불일치 시 403'
          schema:
            type: string
            enum: [engineer, safety]
      responses:
        '200':
          description: 역할별 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
              examples:
                engineer:
                  summary: role=engineer
                  value:
                    role: ENGINEER
                    kpi: { draft: 2, aiRunning: 1, pending: 3, rejected: 1 }
                safety:
                  summary: role=safety
                  value:
                    role: SAFETY_MANAGER
                    kpi: { pending: 5, processedToday: 7, approvedThisMonth: 42, rejectedThisMonth: 6 }
                    rejectReasonTop5:
                      - { category: 규격 부적합, count: 9 }
                      - { category: 법령 미충족, count: 7 }
                      - { category: 안전서류 미흡, count: 5 }
                      - { category: 설명 불충분, count: 3 }
                      - { category: 운전 조건 불일치, count: 2 }
        '400':
          description: '`VALIDATION_FAILED` — `role` 이 `engineer` / `safety` 가 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN_ROLE` — `role` 쿼리와 토큰 역할 불일치'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────────────────────────── WorkRequest ─────────────────────────────
  /work-requests:
    post:
      tags: [WorkRequest]
      operationId: createWorkRequest
      summary: 요청 생성 (임시저장 / 정식)
      description: |
        ENGINEER 전용. 서버가 `requestNo` (`WR-YYYYMMDD-NNN`) 를 채번한다.

        - `draft=true` → 모든 필드 선택. 검증 없이 `DRAFT` 저장 (AC 3-6). FE 는 E_02 에서 사진을 먼저 올리기 위해 항상 이 방식으로 선생성한다 (정합성 메모 #7).
        - `draft=false` → `Y*` 필드 필수 검증 + `productType` 별 `specJson` 스키마 검증. **통과해도 상태는 `DRAFT`** 이며, `POST /agent-runs` 시점에 `AI_RUNNING` 으로 전환된다.

        `specJson` 필수 키는 `ProductType` 스키마 참조.

        **AC 매핑** 3-5 (201) · 3-6 (DRAFT) · 3-3 (400)
      x-api-no: 5
      x-screens: [WRA_E_02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
