            name: { type: string, example: 이엔지 }
        equipment: { type: string, example: 펌프 P-114 }
        line: { type: string, example: A라인 }
        substance: { type: string, example: H2SO4 }
        operatingCondition: { $ref: '#/components/schemas/OperatingCondition' }
        productName: { type: string, example: SS-8-VCR }
